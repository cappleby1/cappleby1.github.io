.card {

h1 { margin: 0; font-weight: 900; font-size: 32px; line-height: 1.1; }
.lead { margin: 0; font-size: 16px; line-height: 1.6; font-weight: 600; color: var(--muted); }

form { display: flex; flex-direction: column; gap: 14px; }
label.field { display: flex; flex-direction: column; gap: 8px; font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--label); }
.pw { position: relative; }
.pw input {

}
.pw input::placeholder { color: var(--label); }
.pw input:focus { outline: none; border-color: var(--accent); }

  position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0; border-radius: 12px;

.eye[aria-pressed="true"] .open { display: none; }

.remember input { position: absolute; opacity: 0; width: 1px; height: 1px; }

.back { color: var(--accent); font-weight: 800; font-size: 15px; text-decoration: none; padding: 10px 14px; border-radius: 999px; }
.back:hover { color: var(--accent-hover); background: rgba(238, 243, 250, .06); }
